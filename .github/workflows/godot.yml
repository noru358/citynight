name: Godot tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 stable
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64
      - name: Run tests
        run: python3 tests/run_tests.py --godot /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64 --output "${{ runner.temp }}/citynight-tests"
